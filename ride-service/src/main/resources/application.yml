server:
  port: ${RIDE_SERVICE_PORT:8083}

spring:
  application:
    name: ride-service
  data:
    mongodb:
      uri: ${RIDE_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/ridelink_ride_db}}
      database: ridelink_ride_db
      auto-index-creation: true

app:
  services:
    driver-service-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
    account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    "[com.ridelink.ride]": DEBUG
    "[org.springframework.data.mongodb]": INFO
